name: "Restart exercise 3 or 4"

# Run manually: Actions tab -> "Restart exercise 3 or 4" -> Run workflow.
# Rebuilds the exercise's files and branches on GitHub from scratch, then updates the README.
# Restarting 3 also clears exercise 4, which is set up again once exercise 3 is done.
on:
  workflow_dispatch:
    inputs:
      exercise:
        description: "Exercise to restart"
        type: choice
        options: ["4", "3"]
        required: true
      confirm:
        description: "I understand my work on this exercise (on GitHub) will be thrown away"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: course-setup
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Stop unless confirmed
        if: ${{ !inputs.confirm }}
        run: |
          echo "::error::Tick the confirm box to restart exercise ${{ inputs.exercise }}."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restart exercise ${{ inputs.exercise }}
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${{ inputs.exercise }}" == 3 ]]; then
            bash .github/course/setup_ex3.sh
            # Exercise 4 depends on 3: clear it so it's set up fresh after 3 is done again.
            git rm -q --ignore-unmatch exercise-4/main-changelog.md exercise-4/feature-notes.md
            git diff --cached --quiet || git commit -m "Restart exercise 3: clear exercise 4"
            git push origin "HEAD:$BASE_BRANCH"
            git push origin --delete ex4/feature 2>/dev/null || true
          else
            BEHIND=10 AHEAD=9 bash .github/course/setup_ex4.sh
          fi
      - name: Update the README
        run: |
          python .github/course/render_readme.py
          git add README.md assets/hero-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Course progress: update README"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
