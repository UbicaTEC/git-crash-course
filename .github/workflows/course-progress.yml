name: Course progress

# Rewrites README.md so it shows only the exercise the student is on.
# Runs on every push to main (a commit or a merged PR). Run it manually to refresh.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-setup
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, not the pushed SHA: a setup workflow may have pushed while we waited.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show the next exercise
        run: |
          python .github/course/render_readme.py
          if git diff --quiet README.md; then
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Course progress: update README" README.md
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
