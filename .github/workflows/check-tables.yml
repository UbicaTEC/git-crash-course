name: Check tables

# Fails if any Markdown table is broken or a merge-conflict marker was left behind.
# On ex3/* branches it also checks that both teammates' work was kept.
on:
  push:
    branches: [main, "ex3/**"]

permissions:
  contents: read

jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Markdown tables
        run: |
          if [[ "${{ github.ref_name }}" == ex3/* ]]; then
            python .github/course/check_tables.py --ex3
          else
            python .github/course/check_tables.py
          fi
